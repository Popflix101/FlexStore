<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | FlexStore</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="index.html">
            FlexStore
        </a>

    </div>

</nav>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="text-center mb-4">

                        Login

                    </h2>

                    <form id="loginForm">

                        <div class="mb-3">

                            <label>Email</label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Password</label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                required>

                        </div>

                        <button
                            class="btn btn-primary w-100">

                            Login

                        </button>

                    </form>

                    <div class="text-center mt-3">

                        Don't have an account?

                        <a href="register.html">

                            Register

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="admin/auth.js"></script>
<script>

document.getElementById("loginForm").addEventListener("submit", function(e){

    e.preventDefault();

    const email = document.getElementById("email").value.trim().toLowerCase();

    const password = document.getElementById("password").value;

    const users = JSON.parse(localStorage.getItem("users")) || [];

    const user = users.find(u =>
        u.email === email &&
        u.password === password
    );

    if(user){

        const normalizedUser = window.FlexStoreAuth && window.FlexStoreAuth.normalizeUser
            ? window.FlexStoreAuth.normalizeUser(user)
            : { ...user, role: user.role || (user.email === "admin@flexstore.com" ? "admin" : "customer") };

        localStorage.setItem(
            "loggedInUser",
            JSON.stringify(normalizedUser)
        );

        alert("Login successful!");

        if (normalizedUser.role === "admin" || normalizedUser.email === "admin@flexstore.com") {
            window.location = "admin/dashboard.html";
        } else {
            window.location = "index.html";
        }

    }else{

        alert("Invalid email or password.");

    }

});

</script>

</body>

</html>
