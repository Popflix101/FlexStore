<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shop | FlexStore</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg sticky-top">

<div class="container">

<a class="navbar-brand fw-bold" href="index.html">

<i class="fa-solid fa-store"></i>

FlexStore

</a>

<button class="navbar-toggler"
data-bs-toggle="collapse"
data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">

<a class="nav-link" href="index.html">

Home

</a>

</li>

<li class="nav-item">

<a class="nav-link active" href="shop.html">

Shop

</a>

</li>

<li class="nav-item">

<a class="nav-link" href="cart.html">

<i class="fa-solid fa-cart-shopping"></i>

<span id="cart-count">0</span>

</a>

</li>

</ul>

</div>

</div>

</nav>

<!-- ================= HEADER ================= -->

<section class="hero py-5">

<div class="container">

<h1 class="fw-bold">

Shop

</h1>

<p>

Browse our latest clothing and smartphones.

</p>

</div>

</section>

<!-- ================= SEARCH ================= -->

<div class="container mt-5">

<div class="row align-items-end">

<div class="col-md-6 mb-3">

<input

type="text"

id="search"

class="form-control form-control-lg"

placeholder="Search products...">

</div>

<div class="col-md-3 mb-3">

<select

id="category"

class="form-select form-select-lg">

<option value="All">

All Categories

</option>

<option value="Clothing">

Clothing

</option>

<option value="Smartphone">

Smartphones

</option>

</select>

</div>

<div class="col-md-3 mb-3">

<select

id="sort"

class="form-select form-select-lg">

<option value="default">

Sort By

</option>

<option value="low">

Price: Low to High

</option>

<option value="high">

Price: High to Low

</option>

</select>

</div>

</div>

</div>

<!-- ================= PRODUCTS ================= -->

<section class="container py-4">

<div class="row" id="shop-products">

</div>

</section>

<!-- ================= FOOTER ================= -->

<footer>

<div class="container text-center">

<p>

© 2026 FlexStore. All Rights Reserved.

</p>

</div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/catalog.js"></script>
<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script src="js/wishlist.js"></script>

<script>

const shopContainer = document.getElementById("shop-products");
const searchInput = document.getElementById("search");
const categorySelect = document.getElementById("category");
const sortSelect = document.getElementById("sort");

const shopProducts = Array.isArray(window.products)
    ? window.products
    : (typeof window.getProducts === "function"
        ? window.getProducts()
        : []);

const shopProductsArray = Array.isArray(shopProducts) ? shopProducts : [];
window.products = shopProductsArray;
window.viewProduct = function(id) {
    localStorage.setItem("selectedProduct", id);
    window.location = "product.html";
};

function safeString(value) {
    return typeof value === "string" ? value : "";
}

function loadProducts(){

let filtered = Array.isArray(shopProducts) ? [...shopProducts] : [];

filtered = filtered.filter(product => product && typeof product === "object" && typeof product.id !== "undefined");

const searchTerm = safeString(searchInput?.value).toLowerCase();

// Search

if (searchTerm) {
    filtered = filtered.filter(product =>
        safeString(product.name).toLowerCase().includes(searchTerm)
    );
}

// Category

if(categorySelect.value!="All"){

filtered = filtered.filter(product=>

product.category===categorySelect.value

);

}

// Sort

if(sortSelect.value=="low"){

filtered.sort((a,b)=>a.price-b.price);

}

if(sortSelect.value=="high"){

filtered.sort((a,b)=>b.price-a.price);

}

shopContainer.innerHTML="";

if (filtered.length === 0) {
    shopContainer.innerHTML = `
        <div class="col-12">
            <div class="alert alert-dark text-center">
                No products found.
            </div>
        </div>
    `;
    return;
}

filtered.forEach(product => {
    shopContainer.innerHTML += `
    <div class="col-lg-4 col-md-6 col-sm-6 mb-4">

        <div class="product-card">

            <div class="product-image">

                <img src="${product.image}" alt="${product.name}">
                

                <button
                    class="wishlist-btn"
                    onclick="toggleWishlist(${product.id}, this)"
                    title="Add to Wishlist">

                    <i class="${
                        wishlist.some(item => item.id === product.id)
                        ? 'fa-solid fa-heart'
                        : 'fa-regular fa-heart'
                    }"></i>

                </button>

                ${product.oldPrice > product.price
                    ? `<span class="sale-badge">SALE</span>`
                    : ""
                }

            </div>

            <div class="product-info">

                <h5>${product.name}</h5>

                <p class="text-muted mb-2">

                    ${product.category}

                </p>

                <div class="price-area">

                    ${
                        product.oldPrice > product.price
                        ? `<span class="old-price">R${product.oldPrice.toFixed(2)}</span>`
                        : ""
                    }

                    <span class="price">

                        R${product.price.toFixed(2)}

                    </span>

                </div>

                <div class="d-grid gap-2 mt-3">

                    <button
                        class="btn btn-dark"
                        onclick="viewProduct(${product.id})">

                        View Product

                    </button>

                    <button
                        class="btn btn-warning"
                        onclick="addToCart(${product.id},1)">

                        <i class="fa-solid fa-cart-shopping"></i>

                        Add To Cart

                    </button>

                </div>

            </div>

        </div>

    </div>
    `;
});
}

loadProducts();

searchInput.addEventListener("keyup",loadProducts);

categorySelect.addEventListener("change",loadProducts);

sortSelect.addEventListener("change",loadProducts);

</script>

</body>

</html>
