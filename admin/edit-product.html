<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Product | FlexStore</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="../css/style.css">

</head>

<body>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow">

<div class="card-body">

<h2 class="mb-4">

Edit Product

</h2>

<form id="editForm">

<div class="mb-3">

<label>Product Name</label>

<input
type="text"
id="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Brand</label>

<input
type="text"
id="brand"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Description</label>

<textarea
id="description"
rows="4"
class="form-control"
required></textarea>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label>Category</label>

<select
id="category"
class="form-select">

<option value="Clothing">Clothing</option>

<option value="Smartphone">Smartphone</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Price</label>

<input
type="number"
id="price"
step="0.01"
class="form-control"
required>

</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label>Stock</label>

<input
type="number"
id="stock"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Old Price</label>

<input
type="number"
id="oldPrice"
step="0.01"
class="form-control">

</div>

</div>

<div class="mb-3">

<label>Product Image</label>

<input
type="file"
id="image"
accept="image/*"
class="form-control">

</div>

<div class="text-center mb-3">

<img
id="preview"
class="img-fluid rounded border"
style="max-width:250px;">

</div>

<div class="d-grid gap-2">

<button class="btn btn-primary btn-lg">

Save Changes

</button>

<a
href="products.html"
class="btn btn-secondary">

Cancel

</a>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

<script>

let products =
JSON.parse(localStorage.getItem("products")) || [];

const id =
Number(localStorage.getItem("editProduct"));

const product =
products.find(p=>p.id===id);

if(!product){

alert("Product not found.");

window.location="products.html";

}

// Fill form

name.value = product.name;
brand.value = product.brand || "";
description.value = product.description;
category.value = product.category;
price.value = product.price;
stock.value = product.stock || 1;
oldPrice.value = product.oldPrice || 0;

preview.src = product.image;

let imageData = product.image;

// New image

image.addEventListener("change",function(){

const file=this.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(e){

imageData=e.target.result;

preview.src=imageData;

};

reader.readAsDataURL(file);

});

// Save

editForm.addEventListener("submit",function(e){

e.preventDefault();

product.name = name.value;

product.brand = brand.value;

product.description = description.value;

product.category=category.value;

product.price=parseFloat(price.value);

product.stock=parseInt(stock.value);

product.oldPrice=parseFloat(oldPrice.value);

product.image=imageData;

product.rating = product.rating || 5;

product.reviews = product.reviews || 0;

product.featured = product.featured ?? true;

localStorage.setItem(
"products",
JSON.stringify(products)
);

alert("✅ Product updated successfully!");

localStorage.removeItem("editProduct");

window.location="products.html";

});

</script>

</body>

</html>
