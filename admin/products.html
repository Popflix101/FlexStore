<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Products | FlexStore</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="../css/style.css">

<style>
/* Debug banner and loader for admin page */
#debugBanner{position:relative;z-index:10;margin-bottom:16px;}
#loader{visibility:hidden;opacity:0;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.75);z-index:2000;display:flex;align-items:center;justify-content:center;transition:opacity .15s ease, visibility .15s ease}
#loader .spinner-border{width:3rem;height:3rem}
</style>

<table class="table table-bordered table-hover align-middle">

<thead class="table-dark">

<tr>

<th>Image</th>

<th>Name</th>

<th>Category</th>

<th>Price</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="productTable">

</tbody>

</table>

<!-- Debug banner shown when no products are available -->
<div id="debugBanner" class="alert alert-warning d-none" role="alert" style="display:none;">
    <strong>Debug:</strong>
    <span id="debugMessage">No products found.</span>
    <button id="restoreDefaults" class="btn btn-sm btn-primary ms-2">Restore defaults</button>
</div>

<!-- Global loader overlay -->
<div id="loader" style="display:none;">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

</div>

</div>

</div>


<script src="../js/catalog.js"></script>
<script src="../js/products.js"></script>

<script>

let adminProducts = [];
let adminProductsInitialized = false;

console.log("Products:", adminProducts);
console.log("Total:", adminProducts.length);

function loadProducts(){

    adminProducts = getProducts();

    return adminProducts;

}

window.renderProducts = renderProducts;

function renderProducts(){
    try{
        const table = document.getElementById("productTable");
        if(!table){ return; }

        loadProducts();

        table.innerHTML = "";

        let filtered = Array.isArray(adminProducts) ? [...adminProducts] : [];

        const searchEl = document.getElementById("search");
        const search = searchEl && searchEl.value ? String(searchEl.value).toLowerCase() : "";

        const categoryEl = document.getElementById("categoryFilter");
        const category = categoryEl && categoryEl.value ? categoryEl.value : "All";

        filtered = filtered.filter(product => {
            const name = product && product.name ? String(product.name) : "";
            const matchSearch = name.toLowerCase().includes(search);
            const matchCategory = category === "All" || (product && product.category === category);
            return matchSearch && matchCategory;
        });

        const banner = document.getElementById('debugBanner');

        if(filtered.length === 0){
            table.innerHTML = `\n<tr>\n<td colspan="5" class="text-center">\nNo products found.\n</td>\n</tr>\n`;
            if(banner){
                document.getElementById('debugMessage').textContent = 'No products found. You can restore the default catalog.';
                banner.style.display = 'block';
                banner.classList.remove('d-none');
            }
            hideLoader();
            return;
        }

        // render rows
        filtered.forEach(product => {
            const imgSrc = product && product.image ? `../${product.image}` : '';
            const price = product && typeof product.price === 'number' ? product.price.toFixed(2) : (product && product.price ? product.price : '0.00');
            const name = product && product.name ? product.name : '(Unnamed Product)';
            const categoryVal = product && product.category ? product.category : '';
            const idVal = product && typeof product.id !== 'undefined' ? product.id : '';

            table.innerHTML += `\n<tr>\n<td width="90">\n<img src="${imgSrc}" style="width:70px;height:70px;object-fit:cover;">\n</td>\n<td>${name}</td>\n<td>${categoryVal}</td>\n<td>R${price}</td>\n<td>\n<button class="btn btn-primary btn-sm" onclick="editProduct(${idVal})">\n<i class="fa-solid fa-pen"></i>\n</button>\n<button class="btn btn-danger btn-sm" onclick="deleteProduct(${idVal})">\n<i class="fa-solid fa-trash"></i>\n</button>\n</td>\n</tr>\n`;
        });

        if(banner){ banner.style.display = 'none'; banner.classList.add('d-none'); }

        hideLoader();

    } catch(err){
        console.error('renderProducts error', err);
        const banner = document.getElementById('debugBanner');
        if(banner){
            document.getElementById('debugMessage').textContent = 'Error rendering products: ' + (err && err.message ? err.message : String(err));
            banner.style.display = 'block';
            banner.classList.remove('d-none');
        }
        hideLoader();
    }

}

window.deleteProduct = function(id){

    const productId = Number(id);

    if(!confirm("Are you sure you want to delete this product?")){

        return;

    }

    loadProducts();
    adminProducts = adminProducts.filter(product => Number(product.id) !== productId);

    if(typeof window.saveProducts === "function"){
        window.saveProducts(adminProducts);
    } else {
        localStorage.setItem("products", JSON.stringify(adminProducts));
    }

    renderProducts();

    alert("Product deleted successfully.");

}

window.editProduct = function(id){

    const productId = Number(id);

    loadProducts();
    const product = adminProducts.find(product => Number(product.id) === productId);

    if(!product){

        alert("Product not found.");

        return;

    }

    localStorage.setItem("editProduct", String(productId));

    window.location = "edit-product.html";

}

// Loader helpers (use visibility/opacity to avoid layout issues)
function showLoader(){
    const l = document.getElementById('loader');
    if(l){ l.style.visibility = 'visible'; l.style.opacity = '1'; }
}

function hideLoader(){
    const l = document.getElementById('loader');
    if(l){ l.style.opacity = '0'; l.style.visibility = 'hidden'; }
}

// Initialize after DOM ready to ensure all elements & scripts are available
function initAdminProducts(){
    if(adminProductsInitialized){ return; }
    adminProductsInitialized = true;

    const searchEl = document.getElementById("search");
    const categoryEl = document.getElementById("categoryFilter");
    const restoreBtn = document.getElementById('restoreDefaults');
    const table = document.getElementById("productTable");

    if(!table){ return; }

    if(searchEl) searchEl.addEventListener('keyup', window.renderProducts);
    if(categoryEl) categoryEl.addEventListener('change', window.renderProducts);

    if(restoreBtn){
        restoreBtn.addEventListener('click', function(){
            if(typeof window.defaultProducts !== 'undefined'){
                localStorage.setItem('products', JSON.stringify(window.defaultProducts));
                window.renderProducts();
                alert('Default catalog restored.');
            } else {
                alert('Default catalog not available.');
            }
        });
    }

    showLoader();
    setTimeout(()=>{
        try{ window.renderProducts(); }catch(e){ console.error(e); }
        hideLoader();
    }, 10);
}

if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initAdminProducts, { once: true });
} else {
    initAdminProducts();
}

</script>

</body>

</html>
