<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orders | FlexStore Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="../css/style.css">

</head>

<body>

<div class="container-fluid">

<div class="row">

<!-- Sidebar -->

<div class="col-md-2 bg-dark text-white min-vh-100 p-3">

<h3>FlexStore</h3>

<hr>

<a href="dashboard.html" class="btn btn-dark w-100 mb-2">Dashboard</a>

<a href="products.html" class="btn btn-dark w-100 mb-2">Products</a>

<a href="orders.html" class="btn btn-primary w-100 mb-2">Orders</a>

<a href="../index.html" class="btn btn-dark w-100">Website</a>

</div>

<!-- Content -->

<div class="col-md-10 p-4">

<h2 class="mb-4">

Customer Orders

</h2>

<div class="row mb-4">

<div class="col-md-6">

<input
type="text"
id="searchOrder"
class="form-control"
placeholder="Search by order number, customer or email...">

</div>

</div>

<div id="ordersContainer"></div>

</div>

</div>

</div>

<script src="auth.js"></script>
<script>
if (!window.FlexStoreAuth.ensureAdminAccess()) {
    throw new Error("Access denied");
}

let orders = JSON.parse(localStorage.getItem("orders")) || [];

const container = document.getElementById("ordersContainer");

function badge(status){

switch(status){

case "Pending":
return "warning";

case "Processing":
return "primary";

case "Shipped":
return "info";

case "Delivered":
return "success";

case "Cancelled":
return "danger";

default:
return "secondary";

}

}

function renderOrders(){

container.innerHTML="";

if(orders.length===0){

container.innerHTML=`

<div class="alert alert-info">

No orders yet.

</div>

`;

return;

}

const search =
document.getElementById("searchOrder")?.value.toLowerCase() || "";

orders.forEach((order,index)=>{

const customerName =
(order.customer.firstName + " " + order.customer.lastName).toLowerCase();

const orderNumber =
(order.orderNumber || "").toLowerCase();

const email =
(order.customer.email || "").toLowerCase();

if(

!customerName.includes(search) &&
!orderNumber.includes(search) &&
!email.includes(search)

){

return;

}

let productsHTML="";

order.items.forEach(item=>{

productsHTML += `

<li>

${item.name}

(x${item.quantity})

</li>

`;

});

container.innerHTML += `

<div class="card shadow-sm mb-4">

<div class="card-body">

<div class="d-flex justify-content-between">

<div>

<h4>

${order.orderNumber}

</h4>

<p>

<strong>Customer:</strong>

${order.customer.firstName}

${order.customer.lastName}

</p>

<p>

<strong>Email:</strong>

${order.customer.email}

</p>

<p>

<strong>Phone:</strong>

${order.customer.phone}

</p>

<p>

<strong>Address:</strong>

${order.customer.address},

${order.customer.city}

</p>

<p>

<strong>Payment:</strong>

${order.payment}

</p>

<p>

<strong>Date:</strong>

${order.date || "N/A"}

</p>

</div>

<div class="text-end">

<h4>

R${order.total.toFixed(2)}

</h4>

<span class="badge bg-${badge(order.status || "Pending")}">

${order.status || "Pending"}

</span>

</div>

</div>

<hr>

<h5>

Products

</h5>

<ul>

${productsHTML}

</ul>

<div class="row mt-3">

<div class="col-md-6">

<select

class="form-select"

onchange="changeStatus(${index},this.value)">

<option

${(order.status=="Pending")?"selected":""}>

Pending

</option>

<option

${(order.status=="Processing")?"selected":""}>

Processing

</option>

<option

${(order.status=="Shipped")?"selected":""}>

Shipped

</option>

<option

${(order.status=="Delivered")?"selected":""}>

Delivered

<option

${(order.status=="Cancelled")?"selected":""}>

Cancelled

</option>

</option>

</select>

</div>

<div class="col-md-6 text-end">

<button

class="btn btn-danger"

onclick="deleteOrder(${index})">

Delete Order

</button>

</div>

</div>

</div>

</div>

`;

});

}

function changeStatus(index,status){

orders[index].status=status;

localStorage.setItem("orders",JSON.stringify(orders));

renderOrders();

}

function deleteOrder(index){

if(confirm("Delete this order?")){

orders.splice(index,1);

localStorage.setItem("orders",JSON.stringify(orders));

renderOrders();

}

}

document.getElementById("searchOrder")
.addEventListener("keyup", renderOrders);

renderOrders();

</script>

</body>

</html>
