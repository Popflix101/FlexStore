<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customers | FlexStore Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="../css/style.css">

</head>

<body>

<div class="container-fluid">

<div class="row">

<!-- Sidebar -->

<div class="col-md-2 bg-dark text-white min-vh-100 p-3">

<h3>FlexStore</h3>

<hr>

<a href="dashboard.html" class="btn btn-dark w-100 mb-2">Dashboard</a>

<a href="products.html" class="btn btn-dark w-100 mb-2">Products</a>

<a href="orders.html" class="btn btn-dark w-100 mb-2">Orders</a>

<a href="customers.html" class="btn btn-primary w-100 mb-2">Customers</a>

<a href="../index.html" class="btn btn-dark w-100">Website</a>

</div>

<!-- Content -->

<div class="col-md-10 p-4">

<h2 class="mb-4">

Registered Customers

</h2>

<input
type="text"
id="search"
class="form-control mb-4"
placeholder="Search customer...">

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>#</th>

<th>Name</th>

<th>Email</th>

<th>Phone</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="customerTable">

</tbody>

</table>

</div>

</div>

</div>

<script src="auth.js"></script>
<script>
if (!window.FlexStoreAuth.ensureAdminAccess()) {
    throw new Error("Access denied");
}

let users =
JSON.parse(localStorage.getItem("users")) || [];

const table =
document.getElementById("customerTable");

function renderCustomers(){

table.innerHTML="";

const search =
document.getElementById("search").value.toLowerCase();

users.forEach((user,index)=>{

const fullname =
(user.firstName + " " + user.lastName).toLowerCase();

if(

!fullname.includes(search) &&
!user.email.toLowerCase().includes(search)

){

return;

}

table.innerHTML += `

<tr>

<td>${index+1}</td>

<td>

${user.firstName}

${user.lastName}

</td>

<td>${user.email}</td>

<td>${user.phone}</td>

<td>

<button
class="btn btn-danger btn-sm"
onclick="deleteCustomer(${index})">

Delete

</button>

</td>

</tr>

`;

});

}

function deleteCustomer(index){

if(confirm("Delete this customer?")){

users.splice(index,1);

localStorage.setItem(

"users",

JSON.stringify(users)

);

renderCustomers();

}

}

document
.getElementById("search")
.addEventListener("keyup",renderCustomers);

renderCustomers();

</script>

</body>

</html>
