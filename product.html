<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Details | FlexStore</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">

<div class="container">

<a class="navbar-brand fw-bold" href="index.html">

<i class="fa-solid fa-store"></i>

FlexStore

</a>

<div class="ms-auto">

<a href="cart.html" class="btn btn-warning">

<i class="fa-solid fa-cart-shopping"></i>

<span id="cart-count">0</span>

</a>

</div>

</div>

</nav>

<!-- ================= PRODUCT ================= -->

<div class="container py-5">

<div class="row">

<div class="col-lg-6">

<img
id="product-image"
class="img-fluid rounded shadow"
src=""
alt="Product">

</div>

<div class="col-lg-6">

<h2 id="product-name"></h2>

<p class="text-muted" id="product-category"></p>

<h3 class="text-success" id="product-price"></h3>

<p id="product-description"></p>

<div class="mb-3">

<label class="form-label">

Quantity

</label>

<input
type="number"
id="quantity"
class="form-control"
min="1"
value="1">

</div>

<div class="d-grid gap-2">

<button
class="btn btn-warning"
id="add-cart-btn">

<i class="fa-solid fa-cart-shopping"></i>

Add to Cart

</button>

<button
class="btn btn-success"
id="buy-now-btn">

Buy Now

</button>

</div>

<hr>

<p>

⭐ ⭐ ⭐ ⭐ ⭐ (4.9 / 5)

</p>

<p class="text-success">

✔ In Stock

</p>

</div>

</div>

</div>

<!-- ================= RELATED PRODUCTS ================= -->

<section class="container py-5">

<h2 class="mb-4">

Related Products

</h2>

<div class="row" id="related-products">

</div>

</section>

<footer>

<div class="container text-center py-4">

<p>

© 2026 FlexStore

</p>

</div>

</footer>

<script src="js/products.js"></script>
<script src="js/app.js"></script>

<script>

const id = Number(localStorage.getItem("selectedProduct"));

const product = products.find(p=>p.id===id);

if(product){

document.getElementById("product-image").src = product.image;

document.getElementById("product-name").textContent = product.name;

document.getElementById("product-category").textContent = product.category;

document.getElementById("product-price").textContent =

"R"+product.price.toFixed(2);

document.getElementById("product-description").textContent =

product.description;

document.getElementById("add-cart-btn").onclick = () => {

    const qty = Number(document.getElementById("quantity").value);

    addToCart(product.id, qty);

};

document.getElementById("buy-now-btn").onclick = () => {

    const qty = Number(document.getElementById("quantity").value);

    addToCart(product.id, qty);

    window.location = "cart.html";

};

}

/*
===========================
Related Products
===========================
*/

const related = document.getElementById("related-products");

products
.filter(p=>p.category===product.category && p.id!==product.id)
.slice(0,3)
.forEach(item=>{

related.innerHTML += `

<div class="col-md-4 mb-4">

<div class="product-card">

<img
src="${item.image}">

<div class="product-info">

<h5>

${item.name}

</h5>

<p class="price">

R${item.price.toFixed(2)}

</p>

<button

class="btn btn-dark"

onclick="viewProduct(${item.id})">

View Product

</button>

</div>

</div>

</div>

`;

});

</script>

</body>

</html>
