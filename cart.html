<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Shopping Cart | FlexStore</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand fw-bold"
href="index.html">

<i class="fa-solid fa-store"></i>

FlexStore

</a>

<div>

<a href="shop.html"
class="btn btn-outline-light me-2">

Continue Shopping

</a>

<a href="checkout.html"
class="btn btn-warning">

Checkout

</a>

</div>

</div>

</nav>

<!-- ================= CART ================= -->

<div class="container py-5">

<h2 class="mb-4">

Shopping Cart

</h2>

<div id="cart-items">

</div>

<div class="card mt-4">

<div class="card-body">

<div class="d-flex justify-content-between">

<h4>Total</h4>

<h4 id="cart-total">

R0.00

</h4>

</div>

<div class="mt-3">

<button id="order-details-toggle" class="btn btn-outline-dark btn-sm" type="button">

<span id="order-details-toggle-text">Show Order Details</span>

</button>

<div id="orderDetailsCollapse" class="collapse mt-3">

<div id="order-details" class="border rounded p-3 bg-light">

</div>

</div>

</div>

<div class="d-grid gap-2 mt-3">

<button
class="btn btn-black"
onclick="clearCart()">

Clear Cart

</button>

<a
href="checkout.html"
class="btn btn-black">

Proceed to Checkout

</a>

</div>

</div>

</div>

</div>

<footer>

<div class="container text-center py-4">

<p>

© 2026 FlexStore

</p>

</div>

</footer>

<script src="js/products.js"></script>
<script src="js/app.js"></script>

<script>

const cartContainer = document.getElementById("cart-items");

function toggleOrderDetails() {
    const panel = document.getElementById("orderDetailsCollapse");
    const toggleText = document.getElementById("order-details-toggle-text");

    if (!panel) return;

    const isOpen = panel.classList.contains("show");
    const nextOpen = !isOpen;

    panel.classList.toggle("show", nextOpen);
    panel.style.display = nextOpen ? "block" : "none";

    if (toggleText) {
        toggleText.textContent = nextOpen ? "Hide Order Details" : "Show Order Details";
    }

    try {
        localStorage.setItem("orderDetailsOpen", nextOpen ? "1" : "0");
    } catch (error) {}
}

function restoreOrderDetailsState() {
    const panel = document.getElementById("orderDetailsCollapse");
    const toggleText = document.getElementById("order-details-toggle-text");

    if (!panel) return;

    let isOpen = false;

    try {
        isOpen = localStorage.getItem("orderDetailsOpen") === "1";
    } catch (error) {}

    panel.classList.toggle("show", isOpen);
    panel.style.display = isOpen ? "block" : "none";

    if (toggleText) {
        toggleText.textContent = isOpen ? "Hide Order Details" : "Show Order Details";
    }
}

document.addEventListener("DOMContentLoaded", function () {
    const toggleButton = document.getElementById("order-details-toggle");
    if (toggleButton) {
        toggleButton.addEventListener("click", toggleOrderDetails);
    }
    restoreOrderDetailsState();
});

// =============================
// Render Cart
// =============================

function renderCart(){

cartContainer.innerHTML = "";

loadCart();

if (typeof window.updateCartCount === "function") {
    window.updateCartCount();
}

if(cart.length===0){

cartContainer.innerHTML = `

<div class="alert alert-info">

Your cart is empty.

</div>

<a
href="shop.html"
class="btn btn-dark">

Go Shopping

</a>

`;

document.getElementById("cart-total").textContent = "R0.00";

return;

}

let total = 0;

cart.forEach(item=>{

const subtotal = item.price * item.quantity;

total += subtotal;

cartContainer.innerHTML += `

<div class="cart-item">

<div class="row align-items-center">

<div class="col-md-2">

<img
src="${item.image}"
class="img-fluid rounded">

</div>

<div class="col-md-4">

<h5>

${item.name}

</h5>

<p>

R${item.price.toFixed(2)}

</p>

</div>

<div class="col-md-2">

<input

type="number"

min="1"

value="${item.quantity}"

class="form-control"

onchange="updateQuantity(${item.id},this.value)">

</div>

<div class="col-md-2">

<strong>

R${subtotal.toFixed(2)}

</strong>

</div>

<div class="col-md-2">

<button

class="btn btn-danger"

onclick="removeItem(${item.id})">

<i class="fa-solid fa-trash"></i>

</button>

</div>

</div>

</div>

`;

});

document.getElementById("cart-total").textContent =

"R"+total.toFixed(2);

restoreOrderDetailsState();

const detailsContainer = document.getElementById("order-details");

if(detailsContainer){

if(cart.length===0){

detailsContainer.innerHTML = "<p class=\"mb-0\">No items selected yet.</p>";
} else {

const currentUser = JSON.parse(localStorage.getItem("loggedInUser")) || null;
const customerName = currentUser
    ? `${currentUser.firstName || ""} ${currentUser.lastName || ""}`.trim()
    : "Guest Customer";
const customerEmail = currentUser?.email || "Not provided";
const customerPhone = currentUser?.phone || "Not provided";
const orderStatus = currentUser ? "Pending" : "Awaiting checkout";

let detailsHtml = `
<div class="mb-3">
    <h6 class="fw-bold mb-2">Customer Information</h6>
    <p class="mb-1"><strong>Name:</strong> ${customerName}</p>
    <p class="mb-1"><strong>Email:</strong> ${customerEmail}</p>
    <p class="mb-0"><strong>Phone:</strong> ${customerPhone}</p>
</div>
<hr class="my-2">
<div class="mb-3">
    <h6 class="fw-bold mb-2">Ordered Products</h6>
`;

cart.forEach(item => {

const subtotal = item.price * item.quantity;

detailsHtml += `<div class="d-flex justify-content-between mb-2"><span>${item.quantity} × ${item.name}</span><strong>R${subtotal.toFixed(2)}</strong></div>`;

});

detailsHtml += `
</div>
<hr class="my-2">
<div class="mb-2">
    <strong>Order Status:</strong> <span class="badge bg-warning text-dark">${orderStatus}</span>
</div>
<div class="d-flex justify-content-between"><strong>Total</strong><strong>R${total.toFixed(2)}</strong></div>`;

detailsContainer.innerHTML = detailsHtml;

}

}

}

// =============================
// Update Quantity
// =============================

function updateQuantity(id, quantity){

quantity = Number(quantity);

if(quantity < 1){

quantity = 1;

}

const item = cart.find(product=>product.id===id);

if(item){

item.quantity = quantity;

}

saveCart();

renderCart();

updateCartCount();

}

// =============================
// Remove Item
// =============================

function removeItem(id){

if(confirm("Remove this item from your cart?")){

cart = cart.filter(item=>item.id!==id);

saveCart();

renderCart();

updateCartCount();

}

}

renderCart();

</script>

</body>

</html>
