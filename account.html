<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Account | FlexStore</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="index.html">

FlexStore

</a>

<div>

<a href="shop.html" class="btn btn-outline-light btn-sm">

Shop

</a>

</div>

</div>

</nav>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow">

<div class="card-body">

<h2 class="mb-4">

My Account

</h2>

<form id="accountForm">

<div class="row">

<div class="col-md-6 mb-3">

<label>First Name</label>

<input
type="text"
id="firstName"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Last Name</label>

<input
type="text"
id="lastName"
class="form-control">

</div>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
id="email"
class="form-control"
readonly>

</div>

<div class="mb-3">

<label>Phone Number</label>

<input
type="text"
id="phone"
class="form-control">

</div>

<hr>

<h4>

Change Password

</h4>

<div class="mb-3">

<label>New Password</label>

<input
type="password"
id="password"
class="form-control">

</div>

<button
class="btn btn-success">

Save Changes

</button>

<button
type="button"
class="btn btn-danger ms-2"
onclick="logout()">

Logout

</button>

</form>

</div>

</div>

</div>

</div>

</div>

<script>

let user = JSON.parse(localStorage.getItem("loggedInUser"));

if(!user){

alert("Please login first.");

window.location = "login.html";

}

firstName.value = user.firstName;
lastName.value = user.lastName;
email.value = user.email;
phone.value = user.phone;

accountForm.addEventListener("submit",function(e){

e.preventDefault();

let users = JSON.parse(localStorage.getItem("users")) || [];

const index = users.findIndex(u=>u.id===user.id);

users[index].firstName = firstName.value;
users[index].lastName = lastName.value;
users[index].phone = phone.value;

if(password.value.trim()!=""){

users[index].password = password.value;

}

localStorage.setItem("users",JSON.stringify(users));

localStorage.setItem(
"loggedInUser",
JSON.stringify(users[index])
);

alert("Account updated successfully.");

});

function logout(){

localStorage.removeItem("loggedInUser");

window.location="login.html";

}

</script>

</body>

</html>
